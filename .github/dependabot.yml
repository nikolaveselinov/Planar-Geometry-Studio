version: 2
updates:
  - package-ecosystem: nuget
    directory: /Source
    schedule:
      interval: weekly
      day: monday
    groups:
      avalonia:
        patterns:
          - Avalonia*
      test-tooling:
        patterns:
          - NUnit*
          - Microsoft.NET.Test.Sdk
    ignore:
      - dependency-name: FluentAssertions
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
