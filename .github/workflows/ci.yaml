name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: Source
        run: dotnet restore GeoGen.sln

      - name: Build
        working-directory: Source
        run: dotnet build GeoGen.sln --configuration Release --no-restore

      - name: Test
        working-directory: Source
        run: dotnet test GeoGen.sln --configuration Release --no-build --verbosity normal

  version:
    name: Read package version
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.read.outputs.number }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "number=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  native-installers:
    needs: [version, build-and-test]
    uses: ./.github/workflows/package-build.yaml
    with:
      version: ${{ needs.version.outputs.number }}
