name: Native packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Installers ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Windows packaging tools
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Publish Windows application
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./publish.ps1 -Runtime '${{ matrix.rid }}' -Version '${{ inputs.version }}'

      - name: Build Windows setup executable
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -Runtime '${{ matrix.rid }}' -Version '${{ inputs.version }}' -SelfSign

      - name: Verify Windows publisher signatures and file metadata
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $app = 'artifacts/staging/${{ matrix.rid }}/PlanarGeometryStudio'
          ./.github/scripts/verify-windows-signatures.ps1 -Files @(
            'artifacts/PlanarGeometryStudio-v${{ inputs.version }}-${{ matrix.rid }}-setup.exe',
            "$app/PlanarGeometryStudio.exe", "$app/tools/engine/GeoGen.exe", "$app/tools/drawer/GeoGen.DrawingLauncher.exe")
          if ((Get-Item "$app/PlanarGeometryStudio.exe").VersionInfo.CompanyName -ne 'Nikola Veselinov') {
            throw 'Executable publisher metadata is missing.'
          }

      - name: Verify Windows install, upgrade, and uninstall
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./.github/scripts/verify-windows-installer.ps1 -Installer (Resolve-Path 'artifacts/PlanarGeometryStudio-v${{ inputs.version }}-win-x64-setup.exe')

      - name: Install Linux packaging tools
        if: startsWith(matrix.rid, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y rpm ripgrep

      - name: Publish Unix application
        if: "!startsWith(matrix.rid, 'win-')"
        run: ./publish.sh '${{ matrix.rid }}' '${{ inputs.version }}'

      - name: Build Linux installers
        if: startsWith(matrix.rid, 'linux-')
        run: ./packaging/linux/build-installers.sh '${{ matrix.rid }}' '${{ inputs.version }}'

      - name: Verify Linux packages and installed engine
        if: startsWith(matrix.rid, 'linux-')
        run: |
          .github/scripts/verify-linux-package.sh 'artifacts/PlanarGeometryStudio-v${{ inputs.version }}-${{ matrix.rid }}.tar.gz'
          .github/scripts/verify-linux-installers.sh '${{ matrix.rid }}'

      - name: Verify drawing-tool setup and real EPS/PDF rendering
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        run: .github/scripts/verify-drawing-tools.sh '${{ matrix.rid }}'

      - name: Capture first-launch setup for visual review
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get install -y xvfb imagemagick xdotool
          xvfb-run -a -s '-screen 0 1100x900x24' .github/scripts/capture-setup.sh \
            "$PWD/artifacts/staging/linux-x64/PlanarGeometryStudio/PlanarGeometryStudio" "$PWD/artifacts/studio-setup.png"

      - name: Upload setup preview
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: studio-setup-preview
          path: artifacts/studio-setup.png

      - name: Build macOS package and disk image
        if: startsWith(matrix.rid, 'osx-')
        run: ./packaging/macos/build-installer.sh '${{ matrix.rid }}' '${{ inputs.version }}'

      - name: Verify macOS installation
        if: startsWith(matrix.rid, 'osx-')
        run: |
          sudo installer -pkg 'artifacts/PlanarGeometryStudio-v${{ inputs.version }}-${{ matrix.rid }}.pkg' -target /
          test -x '/Applications/Planar Geometry Studio.app/Contents/MacOS/PlanarGeometryStudio'
          test -f '/Applications/Planar Geometry Studio.app/Contents/MacOS/setup/drawing-tools.sh'
          codesign --verify --deep '/Applications/Planar Geometry Studio.app'
          engine='/Applications/Planar Geometry Studio.app/Contents/MacOS/tools/engine'
          work="$(mktemp -d)"
          cp -R "$engine/." "$work/"
          cd "$work"
          GEOGEN_NO_PAUSE=1 "$engine/GeoGen"
          test -s Examples/Output/JsonOutput/output.json

      - name: Sign and verify macOS and Linux downloads
        if: "!startsWith(matrix.rid, 'win-')"
        run: |
          if ! command -v gpg >/dev/null; then
            if [[ "${{ runner.os }}" == 'macOS' ]]; then
              brew install gnupg
            else
              sudo apt-get update && sudo apt-get install -y gnupg
            fi
          fi
          ./packaging/sign-downloads.sh '${{ matrix.rid }}' '${{ inputs.version }}'

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/PlanarGeometryStudio-v${{ inputs.version }}-${{ matrix.rid }}*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
