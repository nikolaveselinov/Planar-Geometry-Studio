name: Release

on:
  workflow_dispatch:
    inputs:
      refresh_existing:
        description: Rebuild and replace the current release after all checks pass
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - VERSION
      - .github/workflows/releases.yaml

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      number: ${{ steps.read.outputs.number }}
      refresh: ${{ steps.read.outputs.refresh }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read
        shell: bash
        env:
          REFRESH_RELEASE: ${{ inputs.refresh_existing || contains(github.event.head_commit.message, '[refresh release]') }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi

          project_version="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Source/Launchers/GeoGen.DesktopApp/GeoGen.DesktopApp.csproj)"
          assembly_version="$(sed -n 's:.*<AssemblyVersion>\([^<]*\)</AssemblyVersion>.*:\1:p' Source/Launchers/GeoGen.DesktopApp/GeoGen.DesktopApp.csproj)"
          file_version="$(sed -n 's:.*<FileVersion>\([^<]*\)</FileVersion>.*:\1:p' Source/Launchers/GeoGen.DesktopApp/GeoGen.DesktopApp.csproj)"
          changelog_version="$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          if [[ "$project_version" != "$version" ||
                "$assembly_version" != "$version.0" ||
                "$file_version" != "$version.0" ||
                "$changelog_version" != "$version" ]]; then
            echo "VERSION, app versions, and the latest changelog entry must match." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/v$version" && [[ "$REFRESH_RELEASE" != true ]]; then
            echo "Tag v$version already exists. Releases are not overwritten." >&2
            exit 1
          fi

          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "refresh=$REFRESH_RELEASE" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source, updater, and drawing tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: Source
        run: dotnet restore GeoGen.sln

      - name: Build
        working-directory: Source
        run: dotnet build GeoGen.sln --configuration Release --no-restore

      - name: Test
        working-directory: Source
        run: dotnet test GeoGen.sln --configuration Release --no-build --verbosity normal

  build:
    name: Build native installers
    needs: [version, verify]
    permissions:
      contents: read
    uses: ./.github/workflows/package-build.yaml
    with:
      version: ${{ needs.version.outputs.number }}

  publish:
    name: Publish v${{ needs.version.outputs.number }}
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-staging
          merge-multiple: true

      - name: Prepare downloads and optional verification archive
        run: python3 .github/scripts/prepare-release-assets.py --version '${{ needs.version.outputs.number }}'

      - name: Prepare release notes
        shell: bash
        run: |
          notes="release-notes/v${{ needs.version.outputs.number }}.md"
          if [[ -f "$notes" ]]; then
            cp "$notes" RELEASE_NOTES.md
          else
            awk '/^## \[/{if(found) exit; found=1} found{print}' CHANGELOG.md > RELEASE_NOTES.md
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.number }}
          REFRESH_RELEASE: ${{ needs.version.outputs.refresh }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ "$REFRESH_RELEASE" == true ]] || { echo 'Release replacement requires an explicit refresh.' >&2; exit 1; }
            # Validated replacement packages are ready before changing existing downloads.
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Planar Geometry Studio $tag" --notes-file RELEASE_NOTES.md --latest
            # Remove only the old loose verification files; installer formats stay available.
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > /tmp/studio-release.json
            python3 - <<'PYMETA' > /tmp/studio-obsolete-assets.txt
          import json, os
          prefix = f'PlanarGeometryStudio-v{os.environ["VERSION"]}-'
          with open('/tmp/studio-release.json') as stream:
              assets = json.load(stream)['assets']
          for asset in assets:
              name = asset['name']
              if name.startswith(prefix) and (name.endswith('.asc') or name.endswith('-signatures.txt')):
                  print(asset['id'])
          PYMETA
            while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            done < /tmp/studio-obsolete-assets.txt
          else
            gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Planar Geometry Studio $tag" --notes-file RELEASE_NOTES.md --latest
          fi

      - name: Update previous release summaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in release-notes/*.md; do
            tag="$(basename "$notes" .md)"
            [[ "$tag" == 'v${{ needs.version.outputs.number }}' ]] && continue
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
          done
