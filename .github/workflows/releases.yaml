name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - VERSION

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      number: ${{ steps.read.outputs.number }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: read
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi

          project_version="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Source/Launchers/GeoGen.DesktopApp/GeoGen.DesktopApp.csproj)"
          assembly_version="$(sed -n 's:.*<AssemblyVersion>\([^<]*\)</AssemblyVersion>.*:\1:p' Source/Launchers/GeoGen.DesktopApp/GeoGen.DesktopApp.csproj)"
          file_version="$(sed -n 's:.*<FileVersion>\([^<]*\)</FileVersion>.*:\1:p' Source/Launchers/GeoGen.DesktopApp/GeoGen.DesktopApp.csproj)"
          changelog_version="$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          if [[ "$project_version" != "$version" ||
                "$assembly_version" != "$version.0" ||
                "$file_version" != "$version.0" ||
                "$changelog_version" != "$version" ]]; then
            echo "VERSION, app versions, and the latest changelog entry must match." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "Tag v$version already exists. Releases are not overwritten." >&2
            exit 1
          fi

          echo "number=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release commit
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: Source
        run: dotnet restore GeoGen.sln

      - name: Build
        working-directory: Source
        run: dotnet build GeoGen.sln --configuration Release --no-restore

      - name: Test
        working-directory: Source
        run: dotnet test GeoGen.sln --configuration Release --no-build --verbosity normal

  build:
    name: Build ${{ matrix.rid }}
    needs: [version, verify]
    runs-on: ${{ startsWith(matrix.rid, 'osx-') && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build release package
        run: ./publish.sh "${{ matrix.rid }}" "${{ needs.version.outputs.number }}"

      - name: Verify Linux x64 package
        if: matrix.rid == 'linux-x64'
        run: .github/scripts/verify-linux-package.sh "artifacts/PlanarGeometryStudio-v${{ needs.version.outputs.number }}-linux-x64.tar.gz"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/PlanarGeometryStudio-v${{ needs.version.outputs.number }}-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish v${{ needs.version.outputs.number }}
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum PlanarGeometryStudio-* | sort -k2 > SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          awk '
            /^## \[/ {
              if (found) exit
              found = 1
            }
            found { print }
          ' CHANGELOG.md > release-assets/RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: Planar Geometry Studio v${{ needs.version.outputs.number }}
          body_path: release-assets/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-assets/PlanarGeometryStudio-*
            release-assets/SHA256SUMS
